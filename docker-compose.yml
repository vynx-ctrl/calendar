services:
  calendar:
    build: .
    ports:
      - "${PORT:-3847}:3847"
    env_file:
      - .env
    environment:
      PORT: 3847
      DATA_DIR: /data
      # BASE_URL must be the public URL browsers/Cursor/Slack can reach
      BASE_URL: ${BASE_URL:-http://localhost:3847}
    volumes:
      - calendar-data:/data
    restart: unless-stopped

volumes:
  calendar-data:
