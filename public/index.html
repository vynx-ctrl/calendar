<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Self-hosted Calendar</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="bg"></div>
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <div>
          <p class="eyebrow">Self-hosted</p>
          <h1>Calendar</h1>
        </div>
      </div>
      <div class="status" id="status">Checking connection…</div>
    </header>

    <main>
      <section class="hero-panel" id="connectPanel">
        <h2>Connect Google Calendar</h2>
        <p>
          Authorize once. Then use this UI, the REST API, Cursor MCP at
          <code>/mcp</code>, or messaging webhooks at <code>/hooks</code>.
        </p>
        <a class="btn primary" href="/auth/google">Connect Google</a>
      </section>

      <section class="workspace hidden" id="workspace">
        <div class="toolbar">
          <div>
            <h2>Upcoming</h2>
            <p class="muted" id="rangeLabel">Next 7 days</p>
          </div>
          <div class="actions">
            <button class="btn" id="refreshBtn" type="button">Refresh</button>
            <button class="btn" id="logoutBtn" type="button">Disconnect</button>
          </div>
        </div>

        <div class="layout">
          <form class="composer" id="createForm">
            <h3>New event</h3>
            <label>
              Title
              <input name="title" required placeholder="Standup" />
            </label>
            <div class="row">
              <label>
                Start
                <input name="start" type="datetime-local" required />
              </label>
              <label>
                End
                <input name="end" type="datetime-local" required />
              </label>
            </div>
            <label>
              Description
              <textarea name="description" rows="3" placeholder="Optional notes"></textarea>
            </label>
            <button class="btn primary" type="submit">Create</button>
            <p class="error" id="formError" hidden></p>
          </form>

          <div class="events" id="events"></div>
        </div>
      </section>
    </main>

    <footer>
      <p>
        MCP: <code id="mcpUrl"></code> · Hooks:
        <code>/hooks/message</code> · Slack: <code>/hooks/slack</code>
      </p>
    </footer>
    <script src="/app.js"></script>
  </body>
</html>
